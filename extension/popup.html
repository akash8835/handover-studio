<!doctype html><html><head><meta charset="utf-8"><style>body{width:320px;font:14px system-ui;padding:18px;color:#202321}h2{margin:0 0 8px}input,button{box-sizing:border-box;width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:7px}button{background:#202321;color:white;cursor:pointer}small{color:#777}#status{white-space:pre-wrap}</style></head><body><h2>Handover Studio</h2><small>Personal browser walkthrough recorder</small><input id="url" placeholder="Your Studio URL"><input id="token" type="password" placeholder="Device token from Settings"><input id="title" placeholder="Walkthrough title"><button id="start">Start recording this site</button><button id="stop">Stop and upload privately</button><button id="cancel">Discard recording</button><p id="status"></p><small>All input values are masked. Record only sites you are allowed to capture. Cross-origin frames, canvas and protected browser pages may not replay. No audio is recorded in this version.</small><script src="popup.js"></script></body></html>
